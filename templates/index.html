<!DOCTYPE html>
<html>
<head>
  <title>Customer Churn Prediction</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
  <div class="container mt-5">
    <h2 class="text-primary mb-4">Customer Churn Prediction</h2>
    <form id="predictForm">

      <h5>📊 User Behavior</h5>
      <div class="mb-3">
        <label class="form-label">Age</label>
        <input type="number" id="age" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Avg Time Spent</label>
        <input type="number" id="avg_time_spent" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Avg Transaction Value</label>
        <input type="number" id="avg_transaction_value" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Login Frequency (days)</label>
        <input type="number" id="avg_frequency_login_days" class="form-control" required>
      </div>

      <h5>❗ Complaint Status</h5>
      <div class="mb-3">
        <select id="complaint_status" class="form-select">
          <option value="Solved">Solved</option>
          <option value="Unsolved">Unsolved</option>
        </select>
      </div>

      <h5>💬 Feedback</h5>
      <div class="mb-3">
        <select id="feedback" class="form-select">
          <option value="Poor Product Quality">Poor Product Quality</option>
          <option value="Poor Website">Poor Website</option>
          <option value="Too many ads">Too many ads</option>
        </select>
      </div>

      <!-- Repeat same structure for other dropdowns like region, membership, medium, internet, etc. -->

      <button type="submit" class="btn btn-success mt-3">Predict</button>
    </form>

    <p id="result" class="mt-4 fw-bold fs-4"></p>
  </div>

  <script>
    const buildFeatures = () => {
      const features = [
        parseFloat(document.getElementById('age').value),
        parseFloat(document.getElementById('avg_time_spent').value),
        parseFloat(document.getElementById('avg_transaction_value').value),
        parseFloat(document.getElementById('avg_frequency_login_days').value),

        // Complaint (one-hot)
        document.getElementById('complaint_status').value === 'Solved' ? 1 : 0,
        document.getElementById('complaint_status').value === 'Unsolved' ? 1 : 0,

        // Feedback (one-hot)
        ...['Poor Product Quality', 'Poor Website', 'Too many ads'].map(option =>
          document.getElementById('feedback').value === option ? 1 : 0
        )
      ];

      return features;
    };

    document.getElementById('predictForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const features = buildFeatures();

      const response = await fetch('/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ features })
      });

      const data = await response.json();
      document.getElementById('result').innerText =
        'Prediction: ' + (data.prediction === 1 ? '🚨 Will Churn' : '✅ Will Not Churn');
    });
  </script>
</body>
</html>
