<!DOCTYPE html>
<html>
<head>
  <title>Customer Churn Predictor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand" href="/">🏠 Home</a>
    </div>
  </nav>

  <div class="container mt-5">
    <h2 class="text-primary mb-4">Check Customer Churn Risk</h2>
    <p class="lead">Use the form below to estimate if a customer is likely to churn based on key indicators.</p>

    <form id="predictForm">
      <div class="row g-3">
        <div class="col-md-3">
          <input type="number" class="form-control" id="age" placeholder="Age" required>
        </div>
        <div class="col-md-3">
          <input type="number" class="form-control" id="avg_time_spent" placeholder="Avg Time Spent" required>
        </div>
        <div class="col-md-3">
          <input type="number" class="form-control" id="avg_transaction_value" placeholder="Avg Transaction Value" required>
        </div>
        <div class="col-md-3">
          <input type="number" class="form-control" id="avg_frequency_login_days" placeholder="Login Frequency" required>
        </div>

        <div class="col-md-4">
          <label class="form-label">Complaint Status</label>
          <select class="form-select" id="complaint_status">
            <option value="Solved">Solved</option>
            <option value="Unsolved">Unsolved</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label">Feedback</label>
          <select class="form-select" id="feedback">
            <option value="Poor Product Quality">Poor Product Quality</option>
            <option value="Poor Website">Poor Website</option>
            <option value="Too many ads">Too many ads</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label">Region</label>
          <select class="form-select" id="region_category">
            <option value="City">City</option>
            <option value="Town">Town</option>
            <option value="Village">Village</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label">Membership Category</label>
          <select class="form-select" id="membership_category">
            <option value="Basic">Basic</option>
            <option value="Silver">Silver</option>
            <option value="Gold">Gold</option>
            <option value="Premium">Premium</option>
            <option value="Platinum">Platinum</option>
          </select>
        </div>

        <div class="col-md-4">
          <label for="joined_through_referral" class="form-label">Joined Through Referral</label>
          <select class="form-select" id="joined_through_referral">
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
        </div>
      </div>

      <div class="text-center mt-4">
        <button type="submit" class="btn btn-success">Get Prediction</button>
        <div id="spinner" class="text-info mt-3" style="display: none;">
          <div class="spinner-border" role="status"></div>
          <span>Loading...</span>
        </div>
        <p id="result" class="fw-bold mt-4"></p>
        <p id="confidence" class="text-muted"></p>
      </div>
    </form>

    <hr class="my-5">
    <h4 class="mb-3">📈 Prediction Summary</h4>
    <canvas id="churnChart" width="400" height="150"></canvas>
  </div>

  <script>
    const chartData = {
      labels: ['Will Not Churn', 'Will Churn'],
      datasets: [{
        label: 'Prediction Count',
        backgroundColor: ['#28a745', '#dc3545'],
        data: [0, 0]
      }]
    };

    const churnChart = new Chart(document.getElementById('churnChart'), {
      type: 'bar',
      data: chartData,
      options: {
        responsive: true,
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });

    document.getElementById('predictForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const spinner = document.getElementById('spinner');
      const result = document.getElementById('result');
      const confidence = document.getElementById('confidence');
      spinner.style.display = 'block';
      result.innerText = '';
      confidence.innerText = '';

      const features = [
        document.getElementById('age').value,
        document.getElementById('avg_time_spent').value,
        document.getElementById('avg_transaction_value').value,
        document.getElementById('avg_frequency_login_days').value,
        document.getElementById('complaint_status').value,
        document.getElementById('feedback').value,
        document.getElementById('region_category').value,
        document.getElementById('membership_category').value,
        document.getElementById('joined_through_referral').value,
        0  // Fixed value to maintain input length consistency
      ];

      try {
        const response = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ features })
        });

        const data = await response.json();
        if (data.prediction !== undefined) {
          result.innerText = `Prediction: ${data.prediction === 1 ? '🚨 Will Churn' : '✅ Will Not Churn'}`;
          confidence.innerText = `Confidence: ${(data.confidence * 100).toFixed(2)}%`;
          chartData.datasets[0].data[data.prediction] += 1;
          churnChart.update();
        } else {
          result.innerText = '❌ Unable to process prediction. Please check inputs.';
        }
      } catch (error) {
        result.innerText = '❌ Server error. Try again later.';
      } finally {
        spinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
