<!DOCTYPE html>
<html>
<head>
  <title>Customer Churn Prediction</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }
    button {
      margin-top: 15px;
      padding: 10px 15px;
      background-color: #007BFF;
      color: white;
      border: none;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>Customer Churn Prediction</h2>
  <form id="predictForm">
    <label>Age<input type="number" step="any" id="f0"></label>
    <label>Avg Time Spent<input type="number" step="any" id="f1"></label>
    <label>Avg Transaction Value<input type="number" step="any" id="f2"></label>
    <label>Login Frequency<input type="number" step="any" id="f3"></label>
    <label>Complaint Solved (1/0)<input type="number" step="any" id="f4"></label>
    <label>Complaint Unsolved (1/0)<input type="number" step="any" id="f5"></label>
    <label>Feedback: Poor Quality (1/0)<input type="number" step="any" id="f6"></label>
    <label>Membership: Basic (1/0)<input type="number" step="any" id="f7"></label>
    <label>Region: City (1/0)<input type="number" step="any" id="f8"></label>
    <label>Internet: Mobile Data (1/0)<input type="number" step="any" id="f9"></label>
    <button type="submit">Predict</button>
  </form>
  <p id="result"></p>

  <script>
    document.getElementById('predictForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const features = [];
      for (let i = 0; i < 10; i++) {
        features.push(parseFloat(document.getElementById(`f${i}`).value));
      }

      try {
        const response = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ features })
        });

        const data = await response.json();
        document.getElementById("result").innerText = 
          data.prediction === 1 ? "🚨 Will Churn" : "✅ Will Not Churn";
      } catch (err) {
        document.getElementById("result").innerText = "Error in prediction. Try again.";
      }
    });
  </script>
</body>
</html>
