<!DOCTYPE html>
<html>
<head>
  <title>Customer Churn Prediction</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h2>Customer Churn Prediction</h2>
  <form id="predictForm">
    <div id="formFields"></div>
    <button type="submit">Predict</button>
  </form>
  <p id="result"></p>

  <script>
    const featureNames = [
      "age", "avg_time_spent", "avg_transaction_value", "avg_frequency_login_days",
      "complaint_status_Solved", "complaint_status_Unsolved",
      "feedback_Poor Product Quality", "feedback_Poor Website", "feedback_Too many ads",
      "region_category_City", "region_category_Town",
      "membership_Basic", "membership_Gold", "membership_Platinum", "membership_Premium", "membership_Silver",
      "preferred_offer_types_With Offers",
      "medium_of_operation_Desktop", "medium_of_operation_Mobile",
      "internet_option_Mobile_Data", "internet_option_Wi-Fi"
    ];

    const formFields = document.getElementById('formFields');
    featureNames.forEach((name, i) => {
      formFields.innerHTML += `
        <label for="f${i}">${i + 1}. ${name.replace(/_/g, ' ')}</label>
        <input type="number" id="f${i}" required>
      `;
    });

    document.getElementById('predictForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const features = featureNames.map((_, i) =>
        parseFloat(document.getElementById(`f${i}`).value)
      );

      const response = await fetch('/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ features })
      });

      const data = await response.json();
      document.getElementById('result').innerText =
        'Prediction: ' + (data.prediction === 1 ? '🚨 Will Churn' : '✅ Will Not Churn');
    });
  </script>
</body>
</html>
