<!DOCTYPE html>
<html>
<head>
  <title>Customer Churn Predictor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand" href="/">🏠 Home</a>
    </div>
  </nav>

  <div class="container mt-5">
    <h2 class="text-primary mb-4">Check Customer Churn Risk</h2>
    <form id="predictForm">
      <div class="row g-3">
        <div class="col-md-3"><input type="number" class="form-control" id="age" placeholder="Age" required></div>
        <div class="col-md-3"><input type="number" class="form-control" id="avg_time_spent" placeholder="Avg Time Spent" required></div>
        <div class="col-md-3"><input type="number" class="form-control" id="avg_transaction_value" placeholder="Transaction Value" required></div>
        <div class="col-md-3"><input type="number" class="form-control" id="avg_frequency_login_days" placeholder="Login Frequency" required></div>
        <div class="col-md-4"><label class="form-label">Complaint Status</label>
          <select class="form-select" id="complaint_status">
            <option value="Solved">Solved</option>
            <option value="Unsolved">Unsolved</option>
          </select>
        </div>
        <div class="col-md-4"><label class="form-label">Feedback</label>
          <select class="form-select" id="feedback">
            <option value="Poor Product Quality">Poor Product Quality</option>
            <option value="Poor Website">Poor Website</option>
            <option value="Too many ads">Too many ads</option>
          </select>
        </div>
        <div class="col-md-4"><label class="form-label">Region</label>
          <select class="form-select" id="region_category">
            <option value="City">City</option>
            <option value="Town">Town</option>
            <option value="Village">Village</option>
          </select>
        </div>
        <div class="col-md-4"><label class="form-label">Membership Category</label>
          <select class="form-select" id="membership_category">
            <option value="Basic">Basic</option>
            <option value="Silver">Silver</option>
            <option value="Gold">Gold</option>
            <option value="Premium">Premium</option>
            <option value="Platinum">Platinum</option>
          </select>
        </div>
        <div class="col-md-4"><label class="form-label">Joined Through Referral</label>
          <select class="form-select" id="joined_through_referral">
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
        </div>
      </div>
      <div class="text-center mt-4">
        <button type="button" class="btn btn-outline-primary me-2" onclick="fillExample('good')">Example: Not Churn</button>
        <button type="button" class="btn btn-outline-danger me-2" onclick="fillExample('bad')">Example: Will Churn</button>
        <a href="/download-logs" class="btn btn-outline-secondary">📥 Download Logs</a>
        <button type="submit" class="btn btn-success">Get Prediction</button>
        <div id="spinner" class="text-info mt-3" style="display: none;">
          <div class="spinner-border" role="status"></div><span>Loading...</span>
        </div>
        <p id="result" class="fw-bold mt-4"></p>
        <p id="confidence" class="text-muted"></p>
      </div>
    </form>

    <hr class="my-5">
    <h4 class="mb-3">📈 Prediction Summary</h4>
    <canvas id="churnChart" width="400" height="150"></canvas>

    <hr class="my-5">
    <h4 class="mb-3">🕒 Last 5 Predictions</h4>
    <table class="table table-sm table-striped">
      <thead><tr><th>Time</th><th>Prediction</th><th>Confidence</th><th>Features</th></tr></thead>
      <tbody id="logTableBody"></tbody>
    </table>
  </div>

  <script>
    function fillExample(type) {
      if (type === 'good') {
        document.getElementById('age').value = 35;
        document.getElementById('avg_time_spent').value = 50;
        document.getElementById('avg_transaction_value').value = 1200;
        document.getElementById('avg_frequency_login_days').value = 2;
        document.getElementById('complaint_status').value = 'Solved';
        document.getElementById('feedback').value = 'Too many ads';
        document.getElementById('region_category').value = 'City';
        document.getElementById('membership_category').value = 'Platinum';
        document.getElementById('joined_through_referral').value = 'Yes';
      } else {
        document.getElementById('age').value = 22;
        document.getElementById('avg_time_spent').value = 8;
        document.getElementById('avg_transaction_value').value = 90;
        document.getElementById('avg_frequency_login_days').value = 15;
        document.getElementById('complaint_status').value = 'Unsolved';
        document.getElementById('feedback').value = 'Poor Product Quality';
        document.getElementById('region_category').value = 'Village';
        document.getElementById('membership_category').value = 'Basic';
        document.getElementById('joined_through_referral').value = 'No';
      }
    }

    const chartData = {
      labels: ['Will Not Churn', 'Will Churn'],
      datasets: [{ label: 'Prediction Count', backgroundColor: ['#28a745', '#dc3545'], data: [0, 0] }]
    };

    const churnChart = new Chart(document.getElementById('churnChart'), {
      type: 'bar',
      data: chartData,
      options: { responsive: true, scales: { y: { beginAtZero: true } } }
    });

    document.getElementById('predictForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const spinner = document.getElementById('spinner');
      const result = document.getElementById('result');
      const confidence = document.getElementById('confidence');
      spinner.style.display = 'block';
      result.innerText = '';
      confidence.innerText = '';

      const features = [
        age.value, avg_time_spent.value, avg_transaction_value.value, avg_frequency_login_days.value,
        complaint_status.value, feedback.value, region_category.value,
        membership_category.value, joined_through_referral.value, 0
      ];

      try {
        const response = await fetch('/predict', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ features })
        });

        const data = await response.json();
        if (data.prediction !== undefined) {
          result.innerText = `Prediction: ${data.prediction === 1 ? '🚨 Will Churn' : '✅ Will Not Churn'}`;
          confidence.innerText = `Confidence: ${(data.confidence * 100).toFixed(2)}%`;
          chartData.datasets[0].data[data.prediction] += 1;
          churnChart.update();
          loadRecentLogs();
        }
      } catch (err) {
        result.innerText = '❌ Error occurred';
      } finally {
        spinner.style.display = 'none';
      }
    });

    async function loadRecentLogs() {
      try {
        const res = await fetch('/recent-logs');
        const rows = await res.json();
        const body = document.getElementById('logTableBody');
        body.innerHTML = '';
        rows.forEach(row => {
          const tr = document.createElement('tr');
          row.forEach(cell => {
            const td = document.createElement('td');
            td.textContent = cell;
            tr.appendChild(td);
          });
          body.appendChild(tr);
        });
      } catch (err) {
        console.log('Failed to load logs:', err);
      }
    }

    window.onload = loadRecentLogs;
  </script>
</body>
</html>
