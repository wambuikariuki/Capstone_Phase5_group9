<!DOCTYPE html>
<html>
<head>
  <title>Customer Churn Prediction</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand" href="/">🏠 Home</a>
    </div>
  </nav>

  <div class="container mt-5">
    <h2 class="text-primary mb-4">Customer Churn Prediction</h2>
    <form id="predictForm">

      <h5>📊 User Behavior</h5>
      <div class="mb-3">
        <label class="form-label">Age</label>
        <input type="number" id="age" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Avg Time Spent</label>
        <input type="number" id="avg_time_spent" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Avg Transaction Value</label>
        <input type="number" id="avg_transaction_value" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Login Frequency (days)</label>
        <input type="number" id="avg_frequency_login_days" class="form-control" required>
      </div>

      <h5>❗ Complaint Status</h5>
      <div class="mb-3">
        <select id="complaint_status" class="form-select">
          <option value="Solved">Solved</option>
          <option value="Unsolved">Unsolved</option>
        </select>
      </div>

      <h5>💬 Feedback</h5>
      <div class="mb-3">
        <select id="feedback" class="form-select">
          <option value="Poor Product Quality">Poor Product Quality</option>
          <option value="Poor Website">Poor Website</option>
          <option value="Too many ads">Too many ads</option>
        </select>
      </div>

      <h5>🌍 Region Category</h5>
      <div class="mb-3">
        <select id="region_category" class="form-select">
          <option value="City">City</option>
          <option value="Town">Town</option>
          <option value="Village">Village</option>
        </select>
      </div>

      <h5>🏅 Membership Category</h5>
      <div class="mb-3">
        <select id="membership_category" class="form-select">
          <option value="Basic">Basic</option>
          <option value="Silver">Silver</option>
          <option value="Gold">Gold</option>
          <option value="Premium">Premium</option>
          <option value="Platinum">Platinum</option>
        </select>
      </div>

      <h5>📢 Referral</h5>
      <div class="mb-3">
        <select id="joined_through_referral" class="form-select">
          <option value="Yes">Yes</option>
          <option value="No">No</option>
        </select>
      </div>

      <button type="submit" class="btn btn-success mt-3">Predict</button>
    </form>

    <div id="spinner" class="mt-3 text-info" style="display:none;">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <span>Processing...</span>
    </div>

    <p id="result" class="mt-4 fw-bold fs-4"></p>
    <p id="sampleResult" class="text-muted"></p>
  </div>

  <script>
    const buildFeatures = () => {
      const age = parseFloat(document.getElementById('age').value);
      const avg_time_spent = parseFloat(document.getElementById('avg_time_spent').value);
      const avg_transaction_value = parseFloat(document.getElementById('avg_transaction_value').value);
      const avg_frequency_login_days = parseFloat(document.getElementById('avg_frequency_login_days').value);

      const complaint_status = document.getElementById('complaint_status').value;
      const complaint_solved = complaint_status === 'Solved' ? 1 : 0;
      const complaint_unsolved = complaint_status === 'Unsolved' ? 1 : 0;

      const feedback = document.getElementById('feedback').value;
      const feedback_encoding = ['Poor Product Quality', 'Poor Website', 'Too many ads'].map(option => feedback === option ? 1 : 0);

      const region = document.getElementById('region_category').value;
      const region_encoding = ['City', 'Town', 'Village'].map(opt => region === opt ? 1 : 0);

      const membership = document.getElementById('membership_category').value;
      const membership_encoding = ['Basic', 'Silver', 'Gold', 'Premium', 'Platinum'].map(opt => membership === opt ? 1 : 0);

      const referral = document.getElementById('joined_through_referral').value;
      const referral_yes = referral === 'Yes' ? 1 : 0;
      const referral_no = referral === 'No' ? 1 : 0;

      return [
        age,
        avg_time_spent,
        avg_transaction_value,
        avg_frequency_login_days,
        complaint_solved,
        complaint_unsolved,
        ...feedback_encoding,
        ...region_encoding,
        ...membership_encoding,
        referral_yes,
        referral_no
      ];
    };

    document.getElementById('predictForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const features = buildFeatures();
      const predictBtn = document.querySelector('button[type="submit"]');
      const spinner = document.getElementById('spinner');
      const result = document.getElementById('result');
      const sample = document.getElementById('sampleResult');

      predictBtn.disabled = true;
      spinner.style.display = 'block';
      result.innerText = '';
      sample.innerText = '';

      try {
        const response = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ features })
        });

        const data = await response.json();
        result.innerText =
          'Prediction: ' + (data.prediction === 1 ? '🚨 Will Churn' : '✅ Will Not Churn');
        sample.innerText = `Confidence Score: ${(data.confidence * 100).toFixed(2)}%`;
      } catch (err) {
        result.innerText = '❌ Error: Could not get prediction.';
      } finally {
        spinner.style.display = 'none';
        predictBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
